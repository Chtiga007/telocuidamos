<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Filtro sombra 3D suave -->
    <filter id="clayShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>

    <!-- Gradiente Blob Fondo Cyan Rover -->
    <linearGradient id="blobGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72E2E8" />
      <stop offset="100%" stop-color="#4CD4DD" />
    </linearGradient>

    <!-- Gradiente Perro Miel / Rubio Pastel 3D -->
    <linearGradient id="dogHoney" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="50%" stop-color="#FDBA74" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <linearGradient id="dogEarOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>

    <linearGradient id="dogEarInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
  </defs>

  <!-- SOMBRA DE CONTACTO PISO -->
  <ellipse cx="160" cy="235" rx="80" ry="12" fill="#0F172A" opacity="0.08" />

  <!-- BLOB ORGÁNICO CIRCULAR CELESTE ESTILO ROVER -->
  <path d="M 160 30 C 220 28, 252 68, 252 135 C 252 200, 215 232, 160 232 C 100 232, 68 195, 68 132 C 68 68, 102 32, 160 30 Z" 
        fill="url(#blobGrad2)" />

  <!-- DESTELLOS VERDES SUPERIORES (CELEBRACIÓN / ENCUENTRO ESTILO ROVER) -->
  <g stroke="#10B981" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 142 34 L 134 18" />
    <path d="M 160 28 L 160 12" />
    <path d="M 178 34 L 186 18" />
  </g>

  <!-- PERRO SALUDANDO CON LA PATITA (ESTILO ROVER PASO 2) -->
  <g filter="url(#clayShadow2)">

    <!-- OREJA IZQUIERDA ERGUIDA Y ATENTA -->
    <path d="M 125 105 C 105 75, 75 50, 92 40 C 110 32, 130 65, 138 92 Z" fill="url(#dogEarOuter)" />
    <path d="M 120 95 C 105 75, 88 56, 98 48 C 108 42, 122 68, 128 88 Z" fill="url(#dogEarInner)" />

    <!-- OREJA DERECHA ERGUIDA -->
    <path d="M 195 105 C 215 75, 245 50, 228 40 C 210 32, 190 65, 182 92 Z" fill="url(#dogEarOuter)" />
    <path d="M 200 95 C 215 75, 232 56, 222 48 C 212 42, 198 68, 192 88 Z" fill="url(#dogEarInner)" />

    <!-- CUERPO SENTADO Y COMPACTO -->
    <path d="M 122 225 C 115 175, 130 150, 160 150 C 190 150, 205 175, 198 225 Z" fill="url(#dogHoney)" />
    
    <!-- PECHO BLANCO SUAVE -->
    <ellipse cx="160" cy="188" rx="20" ry="32" fill="#FFFFFF" opacity="0.95" />

    <!-- PATITA IZQUIERDA APOYADA EN EL SUELO -->
    <rect x="130" y="195" width="22" height="32" rx="11" fill="url(#dogHoney)" />
    <ellipse cx="140" cy="226" rx="13" ry="6" fill="#FDBA74" />

    <!-- PATITA DERECHA LEVANTADA SALUDANDO (HIGH FIVE) -->
    <path d="M 188 175 C 205 170, 218 150, 215 130 C 212 118, 200 118, 192 128 C 185 138, 180 155, 180 170 Z" 
          fill="url(#dogHoney)" />
    
    <!-- ALMOHADILLAS DE LA PATITA SALUDANDO -->
    <ellipse cx="205" cy="126" rx="8" ry="7" fill="#FECDD3" />
    <circle cx="199" cy="118" r="3" fill="#FDA4AF" />
    <circle cx="206" cy="115" r="3" fill="#FDA4AF" />
    <circle cx="213" cy="118" r="3" fill="#FDA4AF" />

    <!-- CABEZA DE PERRO DULCE -->
    <ellipse cx="160" cy="115" rx="36" ry="32" fill="url(#dogHoney)" />

    <!-- MANCHA BLANCA FRONTAL -->
    <path d="M 154 85 Q 160 82, 166 85 Q 164 110, 154 110 Z" fill="#FFFFFF" opacity="0.9" />

    <!-- HOZICO REDONDO BLANCO -->
    <ellipse cx="160" cy="128" rx="18" ry="13" fill="#FFFDF8" />

    <!-- NARIZ NEGRA BOTÓN -->
    <path d="M 153 122 C 153 118, 167 118, 167 122 C 167 127, 160 130, 160 130 C 160 130, 153 127, 153 122 Z" fill="#1E293B" />
    <circle cx="157" cy="121" r="1.5" fill="#FFFFFF" />

    <!-- SONRISA FELIZ -->
    <path d="M 160 130 L 160 135" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <path d="M 152 134 Q 160 140, 168 134" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- OJITOS BRILLANTES Y AMIGABLES -->
    <ellipse cx="145" cy="110" rx="5" ry="6" fill="#1E293B" />
    <circle cx="143" cy="108" r="2" fill="#FFFFFF" />

    <ellipse cx="175" cy="110" rx="5" ry="6" fill="#1E293B" />
    <circle cx="173" cy="108" r="2" fill="#FFFFFF" />

    <!-- MEJILLAS SONROJADAS PASTEL -->
    <ellipse cx="138" cy="122" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.6" />
    <ellipse cx="182" cy="122" rx="6" ry="3.5" fill="#FDA4AF" opacity="0.6" />

  </g>

</svg>