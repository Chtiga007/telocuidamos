<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" width="100%" height="100%">
  <defs>
    <!-- Filtro sombra 3D suave -->
    <filter id="clayShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10" />
    </filter>

    <!-- Gradiente Blob Fondo Cyan Rover -->
    <linearGradient id="blobGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72E2E8" />
      <stop offset="100%" stop-color="#4CD4DD" />
    </linearGradient>

    <!-- Gradiente Gatito Gris Carbón / Menta Pastel 3D -->
    <linearGradient id="catGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="catPinkEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE4E6" />
      <stop offset="100%" stop-color="#FECDD3" />
    </linearGradient>
  </defs>

  <!-- SOMBRA DE CONTACTO PISO -->
  <ellipse cx="160" cy="235" rx="80" ry="12" fill="#0F172A" opacity="0.08" />

  <!-- BLOB ORGÁNICO CIRCULAR CELESTE ESTILO ROVER -->
  <path d="M 160 30 C 224 28, 252 68, 252 135 C 252 200, 218 232, 160 232 C 100 232, 68 198, 68 132 C 68 68, 100 32, 160 30 Z" 
        fill="url(#blobGrad3)" />

  <!-- DESTELLOS VERDES SUPERIORES (CELEBRACIÓN ESTILO ROVER) -->
  <g stroke="#10B981" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M 112 36 L 102 20" />
    <path d="M 128 26 L 124 10" />
    <path d="M 146 28 L 150 12" />
  </g>

  <!-- GATITO FESTEJANDO CON LA PATITA ARRIBA (ESTILO ROVER PASO 3) -->
  <g filter="url(#clayShadow3)">

    <!-- OREJA IZQUIERDA -->
    <polygon points="120,110 100,55 140,85" fill="#64748B" />
    <polygon points="122,105 108,68 136,88" fill="url(#catPinkEar)" />

    <!-- OREJA DERECHA -->
    <polygon points="195,110 215,55 175,85" fill="#64748B" />
    <polygon points="193,105 207,68 179,88" fill="url(#catPinkEar)" />

    <!-- COLA CURVA FELIZ -->
    <path d="M 205 210 C 240 200, 250 160, 235 145 C 225 135, 218 145, 222 155 C 228 170, 210 190, 195 200 Z" fill="#64748B" />

    <!-- CUERPO GATUNO -->
    <path d="M 120 225 C 115 175, 128 150, 160 150 C 192 150, 205 175, 200 225 Z" fill="url(#catGrey)" />

    <!-- PECHO BLANCO ESPONJOSO -->
    <path d="M 145 155 C 135 170, 138 200, 160 218 C 182 200, 185 170, 175 155 Z" fill="#FFFFFF" opacity="0.95" />

    <!-- PATA IZQUIERDA EN EL SUELO -->
    <rect x="128" y="198" width="22" height="28" rx="11" fill="#FFFFFF" />
    <ellipse cx="138" cy="226" rx="12" ry="6" fill="#F1F5F9" />

    <!-- PATA DERECHA LEVANTADA CELEBRANDO EN ALTO (COMO EN LA FOTO DE ROVER) -->
    <path d="M 125 160 C 105 145, 90 115, 96 90 C 100 78, 115 82, 118 95 C 122 110, 130 135, 135 155 Z" fill="#FFFFFF" />
    
    <!-- ALMOHADILLAS ROSAS DE LA PATA FESTEJANDO -->
    <ellipse cx="106" cy="88" rx="7" ry="6" fill="#FDA4AF" />
    <circle cx="100" cy="80" r="2.5" fill="#FDA4AF" />
    <circle cx="106" cy="77" r="2.5" fill="#FDA4AF" />
    <circle cx="113" cy="80" r="2.5" fill="#FDA4AF" />

    <!-- CABEZA GATITO -->
    <ellipse cx="160" cy="118" rx="38" ry="30" fill="url(#catGrey)" />

    <!-- MEJILLAS BLANCAS FLUFFY -->
    <ellipse cx="146" cy="128" rx="14" ry="10" fill="#FFFFFF" />
    <ellipse cx="174" cy="128" rx="14" ry="10" fill="#FFFFFF" />

    <!-- BOCA ABIERTA DE EMOCIÓN / FESTEJO (ESTILO ROVER) -->
    <path d="M 152 130 Q 160 148, 168 130 Z" fill="#BE123C" />
    <!-- Lengüita rosa -->
    <ellipse cx="160" cy="136" rx="5" ry="3.5" fill="#FDA4AF" />
    <!-- Diente colmillo pequeño -->
    <polygon points="155,130 157,133 159,130" fill="#FFFFFF" />

    <!-- NARIZ ROSITA -->
    <polygon points="156,124 164,124 160,128" fill="#FDA4AF" />

    <!-- BIGOTES -->
    <g stroke="#CBD5E1" stroke-width="1.8" stroke-linecap="round">
      <line x1="135" y1="126" x2="115" y2="124" />
      <line x1="135" y1="130" x2="115" y2="132" />
      <line x1="185" y1="126" x2="205" y2="124" />
      <line x1="185" y1="130" x2="205" y2="132" />
    </g>

    <!-- OJOS EXPRESIVOS DE FELICIDAD -->
    <ellipse cx="144" cy="110" rx="5" ry="6" fill="#1E293B" />
    <circle cx="142" cy="108" r="2" fill="#FFFFFF" />

    <ellipse cx="176" cy="110" rx="5" ry="6" fill="#1E293B" />
    <circle cx="174" cy="108" r="2" fill="#FFFFFF" />

    <!-- MEJILLAS SONROJADAS -->
    <ellipse cx="134" cy="122" rx="5" ry="3" fill="#FDA4AF" opacity="0.6" />
    <ellipse cx="186" cy="122" rx="5" ry="3" fill="#FDA4AF" opacity="0.6" />

  </g>

</svg>