<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="claySh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="kibbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="boneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1ECE4"/>
    </linearGradient>
  </defs>

  <!-- Plato de comida 3D -->
  <g filter="url(#claySh2)">
    <!-- Base / Cuerpo cónico del plato -->
    <path d="M 12 34 L 16 50 C 16 54, 48 54, 48 50 L 52 34 Z" fill="url(#bowlGrad)"/>
    <!-- Base inferior -->
    <ellipse cx="32" cy="50" rx="16" ry="3.5" fill="#C2410C"/>
    <!-- Borde superior redondeado -->
    <ellipse cx="32" cy="34" rx="22" ry="7.5" fill="#F97316"/>
    <!-- Interior del plato -->
    <ellipse cx="32" cy="34" rx="19" ry="6" fill="#9A3412"/>

    <!-- Huellita blanca decorativa en el frente -->
    <ellipse cx="32" cy="44" rx="3.5" ry="2.5" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="28.5" cy="40.5" r="1.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="31" cy="39" r="1.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="33" cy="39" r="1.2" fill="#FFFFFF" opacity="0.95"/>
    <circle cx="35.5" cy="40.5" r="1.2" fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Croquetas y comida adentro -->
  <g filter="url(#claySh2)">
    <circle cx="25" cy="33" r="3.5" fill="url(#kibbleGrad)"/>
    <circle cx="31" cy="34" r="3.2" fill="url(#kibbleGrad)"/>
    <circle cx="38" cy="33" r="3.4" fill="url(#kibbleGrad)"/>
    <circle cx="28" cy="31" r="3" fill="#B45309"/>
    <circle cx="35" cy="31" r="3" fill="#B45309"/>
  </g>

  <!-- Huesito 3D asomando del plato -->
  <g transform="translate(18, 12) rotate(-22 16 10)" filter="url(#claySh2)">
    <!-- Barra central -->
    <rect x="6" y="7" width="16" height="5.5" rx="2" fill="url(#boneGrad)"/>
    <!-- Nódulos izquierda -->
    <circle cx="6" cy="7" r="3.5" fill="url(#boneGrad)"/>
    <circle cx="6" cy="12" r="3.5" fill="url(#boneGrad)"/>
    <!-- Nódulos derecha -->
    <circle cx="22" cy="7" r="3.5" fill="url(#boneGrad)"/>
    <circle cx="22" cy="12" r="3.5" fill="url(#boneGrad)"/>
    <!-- Brillo superior -->
    <ellipse cx="14" cy="8.5" rx="5" ry="1.2" fill="#FFFFFF"/>
  </g>
</svg>