<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="100%" height="100%">
  <defs>
    <filter id="avatarShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- 7 Circular Avatars of Support Animals with Headsets overlapping footer -->
  
  <!-- Avatar 1: Pug with Headset -->
  <g transform="translate(100, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="34" fill="#FED7AA" />
    <ellipse cx="0" cy="16" rx="18" ry="12" fill="#78350F" />
    <circle cx="0" cy="12" r="4.5" fill="#1E293B" />
    <circle cx="-12" cy="0" r="5" fill="#1E293B" /><circle cx="-14" cy="-2" r="1.5" fill="#FFFFFF" />
    <circle cx="12" cy="0" r="5" fill="#1E293B" /><circle cx="10" cy="-2" r="1.5" fill="#FFFFFF" />
    <ellipse cx="-28" cy="4" rx="8" ry="14" fill="#9A3412" transform="rotate(-15 -28 4)" />
    <ellipse cx="28" cy="4" rx="8" ry="14" fill="#9A3412" transform="rotate(15 28 4)" />
    <!-- Headset -->
    <path d="M -36 -2 C -36 -38, 36 -38, 36 -2" stroke="#0F172A" stroke-width="5" fill="none" />
    <rect x="-42" y="-10" width="12" height="20" rx="6" fill="#EA580C" />
    <rect x="30" y="-10" width="12" height="20" rx="6" fill="#EA580C" />
    <path d="M 36 2 Q 22 22 8 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="6" cy="20" r="4" fill="#1E293B" />
  </g>

  <!-- Avatar 2: Black Lab with Headset -->
  <g transform="translate(265, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="35" fill="#334155" />
    <ellipse cx="0" cy="18" rx="16" ry="12" fill="#1E293B" />
    <circle cx="0" cy="14" r="5" fill="#0F172A" />
    <circle cx="-13" cy="2" r="5" fill="#F8FAFC" /><circle cx="-13" cy="2" r="3.5" fill="#0284C7" /><circle cx="-13" cy="2" r="2" fill="#0F172A" />
    <circle cx="13" cy="2" r="5" fill="#F8FAFC" /><circle cx="13" cy="2" r="3.5" fill="#92400E" /><circle cx="13" cy="2" r="2" fill="#0F172A" />
    <ellipse cx="-30" cy="8" rx="9" ry="18" fill="#1E293B" transform="rotate(-10 -30 8)" />
    <ellipse cx="30" cy="8" rx="9" ry="18" fill="#1E293B" transform="rotate(10 30 8)" />
    <!-- Pink Collar -->
    <path d="M -22 36 Q 0 44 22 36" stroke="#EC4899" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Headset -->
    <path d="M -36 -4 C -36 -40, 36 -40, 36 -4" stroke="#0F172A" stroke-width="5" fill="none" />
    <rect x="-42" y="-12" width="12" height="20" rx="6" fill="#0D9488" />
    <rect x="30" y="-12" width="12" height="20" rx="6" fill="#0D9488" />
    <path d="M 36 0 Q 24 22 10 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="8" cy="20" r="4" fill="#0F172A" />
  </g>

  <!-- Avatar 3: Schnauzer with Headset -->
  <g transform="translate(430, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="34" fill="#64748B" />
    <!-- Beard & Brows -->
    <path d="M -18 -6 Q -12 -16 -6 -6" stroke="#E2E8F0" stroke-width="5" fill="none" stroke-linecap="round" />
    <path d="M 18 -6 Q 12 -16 6 -6" stroke="#E2E8F0" stroke-width="5" fill="none" stroke-linecap="round" />
    <circle cx="-11" cy="0" r="4.5" fill="#0F172A" /><circle cx="-12" cy="-2" r="1.5" fill="#FFFFFF" />
    <circle cx="11" cy="0" r="4.5" fill="#0F172A" /><circle cx="10" cy="-2" r="1.5" fill="#FFFFFF" />
    <!-- Schnauzer Moustache -->
    <path d="M -22 14 Q 0 28 22 14 Q 0 42 -22 14 Z" fill="#E2E8F0" />
    <circle cx="0" cy="14" r="5" fill="#0F172A" />
    <!-- Headset -->
    <path d="M -35 -4 C -35 -40, 35 -40, 35 -4" stroke="#0F172A" stroke-width="5" fill="none" />
    <rect x="-41" y="-12" width="12" height="20" rx="6" fill="#1E293B" />
    <rect x="29" y="-12" width="12" height="20" rx="6" fill="#1E293B" />
    <path d="M 35 0 Q 22 22 8 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="6" cy="20" r="4" fill="#0F172A" />
  </g>

  <!-- Avatar 4: Golden / Cavalier with Headset (Center Hero) -->
  <g transform="translate(600, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="58" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="5" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="38" fill="#FDE68A" />
    <!-- White blaze & snout -->
    <path d="M -8 -16 Q 0 -10 8 -16 L 12 18 Q 0 34 -12 18 Z" fill="#FFFDF8" />
    <ellipse cx="-28" cy="8" rx="14" ry="24" fill="#D97706" />
    <ellipse cx="28" cy="8" rx="14" ry="24" fill="#D97706" />
    <circle cx="-13" cy="2" r="6" fill="#1E293B" /><circle cx="-15" cy="0" r="2" fill="#FFFFFF" />
    <circle cx="13" cy="2" r="6" fill="#1E293B" /><circle cx="11" cy="0" r="2" fill="#FFFFFF" />
    <ellipse cx="0" cy="16" rx="8" ry="6" fill="#0F172A" />
    <path d="M -4 24 Q 0 28 4 24" stroke="#0F172A" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Headset Red/Orange -->
    <path d="M -40 -6 C -40 -46, 40 -46, 40 -6" stroke="#E11D48" stroke-width="6" fill="none" />
    <rect x="-46" y="-14" width="14" height="24" rx="7" fill="#E11D48" />
    <rect x="32" y="-14" width="14" height="24" rx="7" fill="#E11D48" />
    <path d="M 40 -2 Q 26 24 10 22" stroke="#0F172A" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <circle cx="8" cy="22" r="4.5" fill="#0F172A" />
  </g>

  <!-- Avatar 5: Bulldog with Aviator Glasses & Headset -->
  <g transform="translate(770, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="36" fill="#E2E8F0" />
    <path d="M -22 -10 Q 0 -2 22 -10 L 28 8 Q 0 32 -28 8 Z" fill="#FED7AA" />
    <!-- Aviator Sunglasses -->
    <path d="M -24 -2 Q -12 -12 0 -2 Q 12 -12 24 -2 L 20 12 Q 12 18 2 12 Q -12 18 -20 12 Z" fill="#1E293B" stroke="#D97706" stroke-width="2" />
    <ellipse cx="0" cy="18" rx="12" ry="8" fill="#1E293B" />
    <!-- Headset -->
    <path d="M -36 -4 C -36 -40, 36 -40, 36 -4" stroke="#DC2626" stroke-width="5" fill="none" />
    <rect x="-42" y="-12" width="12" height="20" rx="6" fill="#DC2626" />
    <rect x="30" y="-12" width="12" height="20" rx="6" fill="#DC2626" />
    <path d="M 36 0 Q 24 22 10 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="8" cy="20" r="4" fill="#0F172A" />
  </g>

  <!-- Avatar 6: Fluffy Cat with Headset -->
  <g transform="translate(935, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Cat Face -->
    <circle cx="0" cy="8" r="34" fill="#F1F5F9" />
    <!-- Cat Ears -->
    <polygon points="-24,-8 -34,-32 -8,-20" fill="#94A3B8" />
    <polygon points="-22,-10 -30,-28 -12,-20" fill="#FDA4AF" />
    <polygon points="24,-8 34,-32 8,-20" fill="#94A3B8" />
    <polygon points="22,-10 30,-28 12,-20" fill="#FDA4AF" />
    <circle cx="-12" cy="4" r="5" fill="#10B981" /><circle cx="-12" cy="4" r="3" fill="#064E3B" /><circle cx="-13" cy="2" r="1.5" fill="#FFFFFF" />
    <circle cx="12" cy="4" r="5" fill="#10B981" /><circle cx="12" cy="4" r="3" fill="#064E3B" /><circle cx="11" cy="2" r="1.5" fill="#FFFFFF" />
    <polygon points="-4,14 4,14 0,18" fill="#FB7185" />
    <!-- Headset -->
    <path d="M -34 -2 C -34 -38, 34 -38, 34 -2" stroke="#0D9488" stroke-width="4.5" fill="none" />
    <rect x="-40" y="-10" width="11" height="18" rx="5" fill="#0D9488" />
    <rect x="29" y="-10" width="11" height="18" rx="5" fill="#0D9488" />
    <path d="M 34 2 Q 22 22 8 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="6" cy="20" r="3.5" fill="#0F172A" />
  </g>

  <!-- Avatar 7: Border Collie with Headset -->
  <g transform="translate(1100, 65)" filter="url(#avatarShadow)">
    <circle cx="0" cy="0" r="54" fill="url(#circGrad)" stroke="#FFFFFF" stroke-width="4" />
    <!-- Dog Face -->
    <circle cx="0" cy="6" r="35" fill="#1E293B" />
    <path d="M -10 -16 Q 0 -8 10 -16 L 14 18 Q 0 34 -14 18 Z" fill="#FFFFFF" />
    <circle cx="-13" cy="2" r="5.5" fill="#78350F" /><circle cx="-14" cy="0" r="1.8" fill="#FFFFFF" />
    <circle cx="13" cy="2" r="5.5" fill="#78350F" /><circle cx="12" cy="0" r="1.8" fill="#FFFFFF" />
    <ellipse cx="0" cy="16" rx="7" ry="5.5" fill="#0F172A" />
    <path d="M -3 23 Q 0 27 3 23" stroke="#0F172A" stroke-width="2" fill="none" stroke-linecap="round" />
    <ellipse cx="-28" cy="-10" rx="10" ry="16" fill="#1E293B" transform="rotate(-20 -28 -10)" />
    <ellipse cx="28" cy="-10" rx="10" ry="16" fill="#1E293B" transform="rotate(20 28 -10)" />
    <!-- Headset -->
    <path d="M -36 -4 C -36 -40, 36 -40, 36 -4" stroke="#0F172A" stroke-width="5" fill="none" />
    <rect x="-42" y="-12" width="12" height="20" rx="6" fill="#2563EB" />
    <rect x="30" y="-12" width="12" height="20" rx="6" fill="#2563EB" />
    <path d="M 36 0 Q 24 22 10 20" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="8" cy="20" r="4" fill="#0F172A" />
  </g>
</svg>