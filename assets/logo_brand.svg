<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ISOTIPO CIRCULAR TEAL CON MASCOTA 3D / CORAZÓN -->
  <g filter="url(#logoShadow)">
    <rect x="2" y="4" width="44" height="44" rx="14" fill="url(#iconBg)"/>
    
    <!-- Huellita blanca y coral alegre -->
    <ellipse cx="24" cy="29" rx="8.5" ry="6.5" fill="#FFFFFF"/>
    <circle cx="16" cy="18" r="3.2" fill="#FFFFFF"/>
    <circle cx="21.5" cy="14" r="3.2" fill="#FFFFFF"/>
    <circle cx="27" cy="14" r="3.2" fill="#FFFFFF"/>
    <circle cx="32" cy="18" r="3.2" fill="#FFFFFF"/>

    <!-- Detalle corazón coral en la almohadilla -->
    <path d="M 24 28 C 22.5 25.5, 19.5 27, 21.5 29.5 L 24 32 L 26.5 29.5 C 28.5 27, 25.5 25.5, 24 28 Z" fill="#F97316"/>
  </g>

  <!-- TIPOGRAFÍA LEGIBLE Y ROBUSTA -->
  <text x="56" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="-0.03em">
    <tspan fill="#0D9488">Te</tspan><tspan fill="#1E293B">lo</tspan><tspan fill="#F97316">Cuidamos</tspan>
  </text>
  <text x="226" y="34" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#64748B" letter-spacing="-0.02em">.com</text>
</svg>