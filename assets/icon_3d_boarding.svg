<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="claySh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="sofaTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5"/>
      <stop offset="60%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="woodLeg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
  </defs>

  <!-- Patitas de madera inclinadas 3D -->
  <line x1="16" y1="48" x2="12" y2="58" stroke="url(#woodLeg)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="48" y1="48" x2="52" y2="58" stroke="url(#woodLeg)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Sillón / Sofá 3D Hogareño sin Jaulas -->
  <g filter="url(#claySh6)">
    <!-- Respaldo acolchado curvo -->
    <path d="M 16 16 C 16 10, 48 10, 48 16 L 48 36 L 16 36 Z" fill="url(#sofaTeal)"/>
    <!-- Relieve mullido del respaldo -->
    <ellipse cx="32" cy="14" rx="14" ry="4" fill="#5EEAD4"/>
    
    <!-- Apoyabrazos izquierdo -->
    <rect x="8" y="24" width="10" height="22" rx="5" fill="url(#sofaTeal)"/>
    <ellipse cx="13" cy="25" rx="4" ry="2.5" fill="#5EEAD4"/>

    <!-- Apoyabrazos derecho -->
    <rect x="46" y="24" width="10" height="22" rx="5" fill="url(#sofaTeal)"/>
    <ellipse cx="51" cy="25" rx="4" ry="2.5" fill="#5EEAD4"/>

    <!-- Base del asiento -->
    <rect x="14" y="36" width="36" height="12" rx="4" fill="#0F766E"/>

    <!-- Almohadón / Cojín esponjoso en Coral/Crema -->
    <rect x="16" y="32" width="32" height="11" rx="5" fill="url(#cushionGrad)"/>
    <ellipse cx="32" cy="34" rx="12" ry="2.5" fill="#FFF7ED" opacity="0.9"/>
  </g>

  <!-- Manta / Zzz de descanso hogareño -->
  <g filter="url(#claySh6)">
    <!-- Corazón / Zzz de felicidad -->
    <path d="M 28 35 C 26 38, 30 42, 34 38 C 36 36, 40 40, 38 42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
</svg>