<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Filtro sombra 3D suave -->
    <filter id="claySh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="tubGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="60%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="duckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
  </defs>

  <!-- Pata de la bañera izquierda -->
  <path d="M 16 46 C 14 52, 10 54, 12 56 C 14 56, 18 52, 19 46 Z" fill="#D97706"/>
  <!-- Pata derecha -->
  <path d="M 48 46 C 50 52, 54 54, 52 56 C 50 56, 46 52, 45 46 Z" fill="#D97706"/>

  <!-- Bañera 3D pastel -->
  <g filter="url(#claySh1)">
    <!-- Cuerpo bañera -->
    <path d="M 8 26 C 8 46, 20 48, 32 48 C 44 48, 56 46, 56 26 C 56 22, 53 20, 48 20 C 38 20, 26 20, 16 20 C 11 20, 8 22, 8 26 Z" 
          fill="url(#tubGrad)"/>
    <!-- Borde redondeado bañera -->
    <ellipse cx="32" cy="22" rx="24" ry="4.5" fill="#2DD4BF"/>
    <!-- Brillo superior -->
    <path d="M 12 28 C 14 40, 22 43, 32 43" stroke="#99F6E4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>

  <!-- Burbujas volumétricas 3D -->
  <g filter="url(#claySh1)">
    <circle cx="20" cy="18" r="7" fill="url(#bubbleGrad)"/>
    <circle cx="18" cy="16" r="2" fill="#FFFFFF"/>

    <circle cx="28" cy="15" r="8" fill="url(#bubbleGrad)"/>
    <circle cx="26" cy="13" r="2.5" fill="#FFFFFF"/>

    <circle cx="38" cy="17" r="7.5" fill="url(#bubbleGrad)"/>
    <circle cx="36" cy="15" r="2" fill="#FFFFFF"/>

    <circle cx="46" cy="19" r="6" fill="url(#bubbleGrad)"/>
    <circle cx="45" cy="17" r="1.8" fill="#FFFFFF"/>

    <!-- Burbujas flotando -->
    <circle cx="16" cy="8" r="3.5" fill="url(#bubbleGrad)" opacity="0.9"/>
    <circle cx="15" cy="7" r="1" fill="#FFFFFF"/>

    <circle cx="48" cy="10" r="4" fill="url(#bubbleGrad)" opacity="0.85"/>
    <circle cx="47" cy="9" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Patito de goma 3D -->
  <g transform="translate(30, 8) scale(0.7)" filter="url(#claySh1)">
    <ellipse cx="12" cy="10" rx="8" ry="5.5" fill="url(#duckGrad)"/>
    <circle cx="16" cy="6" r="4.5" fill="url(#duckGrad)"/>
    <circle cx="17.5" cy="5" r="0.8" fill="#1E293B"/>
    <path d="M 19 6 Q 23 7, 19 8 Z" fill="#F97316"/>
  </g>
</svg>