<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra suave 3D estilo Dribbble / Clay -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="clayGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Gradientes Pastel Cálidos -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#F1ECE4" />
    </linearGradient>

    <!-- Gradiente Doggo (Dorado Pastel / Durazno) -->
    <linearGradient id="dogBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="dogEar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Gradiente Gatito (Menta Suave / Crema) -->
    <linearGradient id="catBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="catInnerEar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Corazón Flotante Coral Pastel -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
  </defs>

  <!-- Fondo Suave Circular -->
  <circle cx="400" cy="320" r="240" fill="#E6F4F1" opacity="0.6" />
  <circle cx="480" cy="220" r="90" fill="#FEF08A" opacity="0.4" />
  <circle cx="280" cy="380" r="70" fill="#FFEDD5" opacity="0.5" />

  <!-- SOMBRAS EN EL PISO -->
  <ellipse cx="330" cy="480" rx="110" ry="22" fill="#0F172A" opacity="0.08" />
  <ellipse cx="480" cy="480" rx="90" ry="20" fill="#0F172A" opacity="0.08" />

  <!-- ==================== PERRO (IZQUIERDA) ==================== -->
  <g id="dog" filter="url(#softShadow)">
    <!-- Cuerpo Perro -->
    <path d="M 230 470 C 230 330, 410 330, 410 470 Z" fill="url(#dogBody)" />
    <!-- Pecho Blanco Suave -->
    <path d="M 285 470 C 285 375, 355 375, 355 470 Z" fill="#FFFDF8" opacity="0.9" />
    
    <!-- Cabeza Perro -->
    <circle cx="320" cy="290" r="85" fill="url(#dogBody)" />
    
    <!-- Orejas Caídas Perro -->
    <!-- Oreja Izquierda -->
    <path d="M 245 250 C 210 270, 205 350, 235 370 C 255 370, 265 310, 255 260 Z" fill="url(#dogEar)" />
    <!-- Oreja Derecha -->
    <path d="M 395 250 C 430 270, 435 350, 405 370 C 385 370, 375 310, 385 260 Z" fill="url(#dogEar)" />

    <!-- Hocico Perro -->
    <ellipse cx="320" cy="315" rx="38" ry="28" fill="#FFFDF8" />
    <!-- Nariz Perro -->
    <path d="M 308 298 C 314 294, 326 294, 332 298 C 335 304, 325 314, 320 314 C 315 314, 305 304, 308 298 Z" fill="#1E293B" />
    <!-- Sonrisa Perro -->
    <path d="M 312 318 Q 320 326 328 318" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 320 314 L 320 322" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 316 323 C 316 332, 324 332, 324 323 Z" fill="#FB7185" />

    <!-- Ojos Perro (Brillantes y tiernos) -->
    <circle cx="288" cy="272" r="8.5" fill="#1E293B" />
    <circle cx="286" cy="269" r="3" fill="#FFFFFF" />
    <circle cx="352" cy="272" r="8.5" fill="#1E293B" />
    <circle cx="350" cy="269" r="3" fill="#FFFFFF" />

    <!-- Mejillas Ruborizadas -->
    <circle cx="268" cy="295" r="9" fill="#FB7185" opacity="0.3" />
    <circle cx="372" cy="295" r="9" fill="#FB7185" opacity="0.3" />

    <!-- Colgante / Collar Esmeralda -->
    <path d="M 265 365 Q 320 395 375 365" stroke="#0D9488" stroke-width="12" stroke-linecap="round" fill="none" />
    <circle cx="320" cy="385" r="11" fill="#FBBF24" filter="url(#clayGlow)" />
    <circle cx="320" cy="385" r="5" fill="#D97706" />
  </g>

  <!-- ==================== GATO (DERECHA) ==================== -->
  <g id="cat" filter="url(#softShadow)">
    <!-- Cuerpo Gato -->
    <path d="M 405 470 C 405 360, 545 360, 545 470 Z" fill="url(#catBody)" />
    <path d="M 445 470 C 445 395, 505 395, 505 470 Z" fill="#FFFFFF" opacity="0.85" />

    <!-- Cabeza Gato -->
    <circle cx="475" cy="320" r="68" fill="url(#catBody)" />

    <!-- Orejas Gato (Puntiagudas) -->
    <!-- Oreja Izquierda -->
    <polygon points="420,285 410,215 455,255" fill="url(#catBody)" />
    <polygon points="422,275 416,228 448,256" fill="url(#catInnerEar)" />
    <!-- Oreja Derecha -->
    <polygon points="530,285 540,215 495,255" fill="url(#catBody)" />
    <polygon points="528,275 534,228 502,256" fill="url(#catInnerEar)" />

    <!-- Ojos Gato (Contento / Cerrados tiernos en curva) -->
    <path d="M 442 312 Q 452 304 462 312" stroke="#0F766E" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <path d="M 488 312 Q 498 304 508 312" stroke="#0F766E" stroke-width="3.5" fill="none" stroke-linecap="round" />

    <!-- Nariz Gato -->
    <polygon points="471,324 479,324 475,330" fill="#F43F5E" />
    <!-- Sonrisa Gato -->
    <path d="M 469 334 Q 475 340 481 334" stroke="#0F766E" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Bigotes Gato -->
    <line x1="425" y1="326" x2="400" y2="322" stroke="#0F766E" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="425" y1="333" x2="402" y2="335" stroke="#0F766E" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="525" y1="326" x2="550" y2="322" stroke="#0F766E" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="525" y1="333" x2="548" y2="335" stroke="#0F766E" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Mejillas Gato -->
    <circle cx="438" cy="328" r="8" fill="#FDA4AF" opacity="0.4" />
    <circle cx="512" cy="328" r="8" fill="#FDA4AF" opacity="0.4" />

    <!-- Collar Gato Coral -->
    <path d="M 430 380 Q 475 400 520 380" stroke="#F97316" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="475" cy="392" r="7" fill="#FEF08A" />
  </g>

  <!-- ==================== ELEMENTOS FLOTANTES (CORAZÓN Y HUELLITAS) ==================== -->
  <!-- Corazón Flotante 3D -->
  <g transform="translate(400, 160) scale(1.1)" filter="url(#softShadow)">
    <path d="M 0 -10 C -15 -35, -50 -15, -35 15 C -25 35, 0 50, 0 60 C 0 50, 25 35, 35 15 C 50 -15, 15 -35, 0 -10 Z" fill="url(#heartGrad)" />
    <!-- Brillo en el corazón -->
    <ellipse cx="-12" cy="-2" rx="7" ry="12" transform="rotate(-25, -12, -2)" fill="#FFFFFF" opacity="0.4" />
  </g>

  <!-- Huellitas Flotantes Pastel -->
  <g opacity="0.4" transform="translate(180, 220) rotate(-15) scale(0.6)">
    <ellipse cx="30" cy="40" rx="14" ry="11" fill="#0D9488" />
    <circle cx="16" cy="22" r="5" fill="#0D9488" />
    <circle cx="28" cy="18" r="5.5" fill="#0D9488" />
    <circle cx="42" cy="20" r="5" fill="#0D9488" />
  </g>

  <g opacity="0.35" transform="translate(610, 240) rotate(20) scale(0.55)">
    <ellipse cx="30" cy="40" rx="14" ry="11" fill="#F97316" />
    <circle cx="16" cy="22" r="5" fill="#F97316" />
    <circle cx="28" cy="18" r="5.5" fill="#F97316" />
    <circle cx="42" cy="20" r="5" fill="#F97316" />
  </g>

</svg>
