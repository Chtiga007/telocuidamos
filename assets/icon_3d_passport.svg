<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="claySh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <!-- Libreta / Pasaporte 3D inclinado con estilo -->
  <g filter="url(#claySh4)">
    <!-- Páginas interiores blancas -->
    <rect x="15" y="9" width="36" height="46" rx="5" fill="#FFFFFF"/>
    <rect x="16" y="10" width="34" height="44" rx="4" fill="#F1ECE4"/>

    <!-- Tapa del Pasaporte Navy -->
    <rect x="13" y="10" width="36" height="46" rx="5" fill="url(#passGrad)"/>
    <!-- Lomo del pasaporte -->
    <path d="M 13 10 C 13 10, 16 11, 16 33 C 16 55, 13 56, 13 56 Z" fill="#0D9488"/>

    <!-- Escudo dorado central -->
    <circle cx="32" cy="30" r="10" fill="url(#goldGrad)"/>
    
    <!-- Huellita tallada en el centro del escudo -->
    <ellipse cx="32" cy="32" rx="3.5" ry="2.6" fill="#1E293B"/>
    <circle cx="28.8" cy="28.2" r="1.1" fill="#1E293B"/>
    <circle cx="31" cy="27" r="1.1" fill="#1E293B"/>
    <circle cx="33" cy="27" r="1.1" fill="#1E293B"/>
    <circle cx="35.2" cy="28.2" r="1.1" fill="#1E293B"/>

    <!-- Líneas doradas de texto pasaporte -->
    <rect x="23" y="16" width="18" height="2" rx="1" fill="url(#goldGrad)"/>
    <rect x="26" y="44" width="12" height="1.8" rx="0.9" fill="url(#goldGrad)"/>
    <rect x="24" y="48" width="16" height="1.8" rx="0.9" fill="url(#goldGrad)"/>

    <!-- Brillo superior diagonal -->
    <path d="M 18 12 L 44 12" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>