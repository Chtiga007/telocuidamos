<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <linearGradient id="bgPastel1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6F4F1" />
      <stop offset="100%" stop-color="#D1ECE6" />
    </linearGradient>
    <linearGradient id="poodleClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="100%" stop-color="#FDBA74" />
    </linearGradient>
    <linearGradient id="bubbleClay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="tubClay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="400" height="280" rx="24" fill="url(#bgPastel1)" />

  <!-- Badge Top Right -->
  <rect x="315" y="18" width="65" height="26" rx="13" fill="#FFFFFF" opacity="0.9" />
  <text x="347" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#0D9488" text-anchor="middle" letter-spacing="1">SPA 3D</text>

  <!-- Bath Tub 3D Clay -->
  <g filter="url(#clayShadow)">
    <ellipse cx="200" cy="225" rx="130" ry="18" fill="#0F172A" opacity="0.06" />
    <!-- Tub base -->
    <path d="M 85 160 C 90 220, 310 220, 315 160 Z" fill="url(#tubClay)" />
    <!-- Tub rim -->
    <ellipse cx="200" cy="160" rx="115" ry="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <!-- Water surface -->
    <ellipse cx="200" cy="164" rx="100" ry="14" fill="#7DD3FC" opacity="0.75" />
  </g>

  <!-- 3D Poodle in the Tub -->
  <g filter="url(#clayShadow)">
    <!-- Fluffy Head -->
    <circle cx="200" cy="115" r="48" fill="url(#poodleClay)" />
    <!-- Ears -->
    <ellipse cx="152" cy="120" rx="18" ry="26" fill="#FB923C" />
    <ellipse cx="248" cy="120" rx="18" ry="26" fill="#FB923C" />
    <!-- Top Fur Fluff -->
    <circle cx="185" cy="78" r="16" fill="url(#poodleClay)" />
    <circle cx="200" cy="72" r="18" fill="url(#poodleClay)" />
    <circle cx="215" cy="78" r="16" fill="url(#poodleClay)" />
    <!-- Snout -->
    <ellipse cx="200" cy="128" rx="20" ry="15" fill="#FFFBEB" />
    <!-- Nose & Smile -->
    <circle cx="200" cy="122" r="6" fill="#1E293B" />
    <path d="M 195 132 Q 200 137 205 132" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <!-- Eyes -->
    <circle cx="184" cy="110" r="5" fill="#1E293B" />
    <circle cx="182" cy="108" r="1.8" fill="#FFFFFF" />
    <circle cx="216" cy="110" r="5" fill="#1E293B" />
    <circle cx="214" cy="108" r="1.8" fill="#FFFFFF" />
    <!-- Blush -->
    <circle cx="170" cy="125" r="7" fill="#FB7185" opacity="0.3" />
    <circle cx="230" cy="125" r="7" fill="#FB7185" opacity="0.3" />
  </g>

  <!-- 3D Clay Soap Bubbles -->
  <g>
    <circle cx="135" cy="145" r="14" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="150" cy="138" r="10" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="260" cy="148" r="13" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="245" cy="140" r="9" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="190" cy="65" r="8" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="210" cy="60" r="10" fill="url(#bubbleClay)" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Arrow Circle Bottom Right -->
  <circle cx="355" cy="240" r="18" fill="#FFFFFF" opacity="0.9" />
  <text x="355" y="245" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold" fill="#0D9488" text-anchor="middle">↗</text>
</svg>