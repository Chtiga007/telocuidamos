<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <filter id="claySh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="leashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="medalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="metalClip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Correa enrollada / Mango ergonómico 3D -->
  <g filter="url(#claySh5)">
    <!-- Curva de la correa -->
    <path d="M 44 14 C 54 18, 54 32, 42 36 C 30 40, 22 26, 26 16 C 28 11, 38 10, 44 14 Z" 
          stroke="url(#leashGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="44" cy="14" r="3.5" fill="#C2410C"/>
  </g>

  <!-- Mosquetón metálico 3D -->
  <g filter="url(#claySh5)" transform="translate(18, 28) rotate(15)">
    <rect x="0" y="0" width="6" height="10" rx="3" fill="url(#metalClip)"/>
    <circle cx="3" cy="2" r="1.5" fill="#1E293B"/>
  </g>

  <!-- Collar de paseo 3D en primer plano -->
  <g filter="url(#claySh5)">
    <!-- Aro del collar -->
    <ellipse cx="32" cy="42" rx="20" ry="9" stroke="url(#leashGrad)" stroke-width="5.5" fill="none"/>
    <!-- Costuras o tachas decorativas -->
    <circle cx="16" cy="42" r="1.5" fill="#FED7AA"/>
    <circle cx="48" cy="42" r="1.5" fill="#FED7AA"/>
    <circle cx="32" cy="46" r="1.5" fill="#FED7AA"/>

    <!-- Anilla de unión dorada -->
    <circle cx="32" cy="47" r="3.5" stroke="url(#medalGold)" stroke-width="1.8" fill="none"/>
    <!-- Medalla colgante dorada -->
    <circle cx="32" cy="54" r="6" fill="url(#medalGold)"/>
    <!-- Huellita tallada en la medalla -->
    <ellipse cx="32" cy="55" rx="2.2" ry="1.6" fill="#78350F"/>
    <circle cx="30" cy="52.5" r="0.8" fill="#78350F"/>
    <circle cx="31.5" cy="51.8" r="0.8" fill="#78350F"/>
    <circle cx="32.5" cy="51.8" r="0.8" fill="#78350F"/>
    <circle cx="34" cy="52.5" r="0.8" fill="#78350F"/>
  </g>
</svg>